
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Colourful To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="title-section">
                <span class="emoji">📋</span>
                <div>
                    <h1>DoodleDo!!!!</h1>
                    <p>Plan • Organize • Achieve</p>
                </div>
            </div>

            <div class="motivation">
                You've got this! ✨
            </div>
        </header>

        <!-- Add Task Section -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="✨ Enter your task..."
            >

            <button id="addBtn">＋ Add Task</button>

        </div>

        <!-- Filters and Counter -->
        <div class="filter-section">

            <div class="filters">

                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="pending">
                    Pending
                </button>

                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>

            </div>

            <div class="task-count">
                <span>Total: <b id="totalCount">0</b></span>
                <span>Pending: <b id="pendingCount">0</b></span>
                <span>Done: <b id="completedCount">0</b></span>
            </div>

        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Empty Message -->
        <p id="emptyMessage">
            🌸 No tasks yet. Add your first task!
        </p>

        <!-- Progress Section -->
        <div class="progress-section">

            <div class="progress-heading">
                <span>🌱 Your Progress</span>
                <span id="progressText">0% Completed</span>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </div>

        <!-- Footer -->
        <footer>
            Keep going! You are doing great! 💪
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
